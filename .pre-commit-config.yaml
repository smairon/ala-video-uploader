default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: bandit
        name: bandit security scan
        entry: uv run bandit -c pyproject.toml -r src scripts
        language: system
        pass_filenames: false
        types_or: [python, pyi]